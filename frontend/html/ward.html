<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ward & Admission Management</title>

  <link rel="stylesheet" href="/frontend/css/base.css" />
  <link rel="stylesheet" href="/frontend/css/ward.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">Hospital System</h2>

    <nav id="sidebarNav">
      <a data-page="dashboard" class="nav-link active">Dashboard</a>

      <a data-page="patients" data-role="admin,reception,nurse">Patients</a>
      <a data-page="appointments" data-role="admin,reception,doctor">Appointments</a>
      <a data-page="treatments" data-role="admin,doctor,nurse">Treatments</a>
      <a id="act" data-page="wards" data-role="admin,nurse">Wards & Admission</a>
      <a data-page="billing" data-role="admin,accounts">Billing</a>
      <a data-page="salary" data-role="admin,accounts">Salary Payments</a>
    </nav>

    <button class="logout">Logout</button>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- HEADER -->
    <header class="header">
      <div>
        <h1>Welcome, <span id="userName">—</span></h1>
        <p id="userRole">— Dashboard</p>
      </div>

      <div class="user">
        <span id="headerUserName">—</span>
        <div class="avatar" id="userAvatar">?</div>
      </div>
    </header>

    <!-- TITLE -->
    <div class="page-title">
      <h2>Ward & Admission Management</h2>
      <button id="toggleAdmitBtn" class="primary-btn admin-only">
        + Admit Patient
      </button>
    </div>

    <!-- WARDS -->
    <div class="ward-grid" id="wardGrid"></div>

    <!-- ✅ MODAL -->
    <div id="admitFormCard" class="hidden admin-only">
      <div class="form-container">

        <h3>Admit Patient</h3>

        <div class="form-grid">
          <div>
            <label>Patient</label>
            <select id="patientSelect"></select>
          </div>

          <div>
            <label>Ward</label>
            <select id="wardSelect"></select>
          </div>

          <div>
            <label>Admission Date</label>
            <input type="date" id="admissionDate" />
          </div>
        </div>

        <div class="form-actions">
          <button id="admitBtn" class="primary-btn">Admit Patient</button>
          <button id="cancelAdmitBtn" class="secondary-btn">Cancel</button>
        </div>

      </div>
    </div>

    <!-- TABLE -->
    <div class="card">
      <h3>Active Admissions</h3>
      <table class="table">
        <thead>
          <tr>
            <th>PATIENT ID</th>
            <th>PATIENT NAME</th>
            <th>WARD</th>
            <th>ADMISSION DATE</th>
            <th>DISCHARGE DATE</th>
            <th>STATUS</th>
            <th class="admin-only">ACTION</th>
          </tr>
        </thead>
        <tbody id="admissionTable"></tbody>
      </table>
    </div>

  </main>
</div>

<script src="/frontend/js/toast.js"></script>
<script src="/frontend/js/layout.js"></script>
<script src="/frontend/js/ward.js"></script>
</body>
</html>
