<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Bills</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/my-bills.css" />
</head>

<body>

<div class="app-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">Hospital System</h2>

    <nav id="sidebarNav">
      <a class="nav-link" data-page="dashboard">Dashboard</a>
      <a class="nav-link" data-page="patients" data-role="admin,reception,nurse">Patients</a>
      <a class="nav-link" data-page="appointments" data-role="admin,reception,doctor">Appointments</a>
      <a class="nav-link" data-page="treatments" data-role="admin,doctor,nurse">Treatments</a>
      <a class="nav-link" data-page="wards" data-role="admin,nurse">Wards</a>
      <a class="nav-link" data-page="billing" data-role="admin,accounts">Billing</a>
      <a class="nav-link" data-page="salary" data-role="admin,accounts">Salary</a>

      <a class="nav-link" data-page="patient-profile" data-role="patient,reception">My Profile</a>
      <a class="nav-link" data-page="my-appointments" data-role="patient,doctor">My Appointments</a>
      <a class="nav-link active" data-page="my-bills" data-role="patient">My Bills</a>
    </nav>

    <button class="logout">Logout</button>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- HEADER -->
    <header class="header">
      <div>
        <div id="welcomeText"></div>
        <div id="headerUserName"></div>
        <div id="userRole"></div>
      </div>
      <div id="userAvatar" class="avatar"></div>
    </header>

    <!-- BILLS SECTION -->
    <section class="page active">
      <h2>My Bills</h2>

      <table>
        <thead>
          <tr>
            <th>Bill ID</th>
            <th>Total</th>
            <th>Status</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="bills"></tbody>
      </table>
    </section>

  </main>
</div>

<script src="../js/layout.js"></script>
<script src="../js/my-bills.js"></script>

</body>
</html>
