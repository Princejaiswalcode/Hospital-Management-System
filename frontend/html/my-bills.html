<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Bills</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/my-bills.css" />
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">Hospital System</h2>

    <nav id="sidebarNav">
      <a class="nav-link" href="dashboard.html">Dashboard</a>
      <a class="nav-link" href="patient-profile.html">My Profile</a>
      <a class="nav-link" href="my-appointments.html">My Appointments</a>
      <a class="nav-link active" href="my-bills.html">My Bills</a>
    </nav>

    <button class="logout">Logout</button>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- HEADER -->
    <header class="header">
      <div>
        <h1 id="welcomeText">Welcome</h1>
        <p id="userRole">Dashboard</p>
      </div>

      <div class="user-box">
        <span id="headerUserName"></span>
        <div id="userAvatar" class="avatar"></div>
      </div>
    </header>

    <!-- SUMMARY CARDS -->
    <section class="summary-grid">
      <div class="card">
        <p>Total Amount</p>
        <h2 id="totalAmount">₹0</h2>
      </div>

      <div class="card">
        <p>Paid Amount</p>
        <h2 class="green" id="paidAmount">₹0</h2>
      </div>

      <div class="card">
        <p>Pending Amount</p>
        <h2 class="red" id="pendingAmount">₹0</h2>
      </div>
    </section>

    <!-- TABLE -->
    <section class="table-card">
      <table>
        <thead>
          <tr>
            <th>Bill Date</th>
            <th>Consultation</th>
            <th>Medicine</th>
            <th>Room</th>
            <th>Total</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody id="bills">
          <!-- Dynamic data -->
        </tbody>
      </table>
    </section>

    <!-- REMINDER -->
    <section class="reminder" id="reminderBox" style="display:none;"></section>

  </main>
</div>

<script src="../js/layout.js"></script>
<script src="../js/my-bills.js"></script>

</body>
</html>
