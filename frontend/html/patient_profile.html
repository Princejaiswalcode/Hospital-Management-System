<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/patient-profile.css" />
</head>
<body>

<div class="app"> <!-- ✅ FIXED -->

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">Hospital System</h2>

    <nav id="sidebarNav">
      <a class="nav-link" data-page="dashboard">Dashboard</a>
      <a class="nav-link" data-page="patients" data-role="admin,reception,nurse">Patients</a>
      <a class="nav-link" data-page="appointments" data-role="admin,reception,doctor">Appointments</a>
      <a class="nav-link" data-page="treatments" data-role="admin,doctor,nurse">Treatments</a>
      <a class="nav-link" data-page="wards" data-role="admin,nurse">Wards</a>
      <a class="nav-link" data-page="billing" data-role="admin,accounts">Billing</a>
      <a class="nav-link" data-page="salary" data-role="admin,accounts">Salary</a>

      <a class="nav-link active" data-page="patient-profile" data-role="patient,reception">My Profile</a>
      <a class="nav-link" data-page="my-appointments" data-role="patient,doctor">My Appointments</a>
      <a class="nav-link" data-page="my-bills" data-role="patient">My Bills</a>
    </nav>

    <button class="logout">Logout</button>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- HEADER -->
    <header class="header">
      <div>
        <h1>My Profile</h1>
        <p>Patient Information</p>
      </div>

      <div class="user-box">
        <span id="headerUserName"></span>
        <div id="userAvatar" class="avatar"></div>
      </div>
    </header>

    <!-- PROFILE -->
    <div class="profile-container">

      <!-- TOP -->
      <div class="profile-header">
        <div class="profile-avatar" id="avatarLarge">P</div>

        <div>
          <h2 id="name"></h2>
          <p>Patient ID: <span id="patientId"></span></p>
        </div>
      </div>

      <!-- DETAILS -->
      <div class="profile-details">

        <div class="info-box">
          <div class="icon blue">👤</div>
          <div>
            <p class="label">Personal Information</p>
            <p><b>Age:</b> <span id="age"></span></p>
            <p><b>Gender:</b> <span id="gender"></span></p>
          </div>
        </div>

        <div class="info-box">
          <div class="icon green">📞</div>
          <div>
            <p class="label">Contact</p>
            <p id="phone"></p>
          </div>
        </div>

        <div class="info-box">
          <div class="icon purple">📍</div>
          <div>
            <p class="label">Address</p>
            <p id="address"></p>
          </div>
        </div>

        <div class="info-box">
          <div class="icon orange">❤️</div>
          <div>
            <p class="label">Current Status</p>
            <span class="status-badge" id="status"></span>
          </div>
        </div>

      </div>

    </div>

  </main>
</div>

<script src="../js/toast.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/patient-profile.js"></script>

</body>
</html>
