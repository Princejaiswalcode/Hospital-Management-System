<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hospital System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../css/my-appointments.css">
<link rel="stylesheet" href="../css/base.css">

</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar">

<h2 class="logo">Hospital System</h2>

<nav id="sidebarNav">

    <a class="nav-link" data-page="dashboard">Dashboard</a>
    <a class="nav-link" data-page="patients" data-role="admin,reception,nurse">Patients</a>
    <a class="nav-link" data-page="appointments" data-role="admin,reception,doctor">Appointments</a>
    <a class="nav-link" data-page="treatments" data-role="admin,doctor,nurse">Treatments</a>
    <a class="nav-link" data-page="wards" data-role="admin,nurse">Wards & Admission</a>
    <a class="nav-link" data-page="billing" data-role="admin,accounts">Billing</a>
    <a class="nav-link" data-page="salary" data-role="admin,accounts">Salary Payments</a>
    <a class="nav-link" data-page="patient-profile" data-role="patient,reception">My Profile</a>
    <a class="nav-link" data-page="my-appointments" data-role="patient,doctor">My Appointments</a>
    <a class="nav-link" data-page="myBills" data-role="patient">My Bills</a>
  </nav>

<button class="logout">Logout</button>

</aside>


<!-- MAIN -->
<main class="main">

<div class="page-title">
<h2>My Appointments</h2>
</div>

<div class="card">

<table class="table">

<thead>
<tr>
<th>Doctor</th>
<th>Date</th>
<th>Time</th>
<th>Status</th>
</tr>
</thead>

<tbody id="appointments">

<tr>
<td colspan="4" style="text-align:center;color:#777;padding:20px;">
No appointments found
</td>
</tr>

</tbody>

</table>

</div>

</main>

</div>

<script type="module" src="../js/my-appointments.js"></script>
<script src="../js/layout.js"></script>
</body>
</html>
