<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Appointments</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/my-appointments.css">
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<aside class="sidebar">
  <h2 class="logo">Hospital System</h2>

  <nav id="sidebarNav">
    <a class="nav-link" data-page="dashboard">Dashboard</a>
    <a class="nav-link" data-page="patient-profile" data-role="patient">My Profile</a>
    <a class="nav-link active" data-page="my-appointments" data-role="patient,doctor">My Appointments</a>
    <a class="nav-link" data-page="my-bills" data-role="patient">My Bills</a>
  </nav>

  <button class="logout">Logout</button>
</aside>

<!-- MAIN -->
<main class="main">

<header class="header">
  <div>
    <h1 id="welcomeText">Welcome</h1>
    <p>Dashboard</p>
  </div>

  <div class="user-box">
    <span id="headerUserName"></span>
    <div id="userAvatar" class="avatar"></div>
  </div>
</header>

<!-- TITLE + BUTTON -->
<div class="page-top">
  <h2>My Appointments</h2>
  <button class="primary-btn" id="btnShowForm">+ Book Appointment</button>
</div>

<!-- TABLE -->
<div class="card">

<h3 class="section-title">Past Appointments</h3>

<table class="table">
<thead>
<tr>
<th>Doctor</th>
<th>Date</th>
<th>Time</th>
<th>Type</th>
<th>Status</th>
</tr>
</thead>

<tbody id="appointments">
<tr>
<td colspan="5" style="text-align:center;padding:20px;color:#777">
No appointments found
</td>
</tr>
</tbody>

</table>

</div>

</main>
</div>

<!-- =========================
     MODAL + BACKDROP
========================= -->

<!-- BACKDROP -->
<div id="modalBackdrop" class="backdrop hidden"></div>

<!-- MODAL -->
<div id="appointmentModal" class="modal hidden">

  <div class="modal-content">

    <h3>Book Appointment</h3>

    <form id="appointmentForm" class="form-grid">

      <div>
        <label>Doctor</label>
        <select id="doctorSelect" required>
          <option value="">Select Doctor</option>
        </select>
      </div>

      <div>
        <label>Date</label>
        <input type="date" id="appointmentDate" required />
      </div>

      <div>
        <label>Time</label>
        <select id="appointmentTime" required>
          <option value="">Select Time</option>
        </select>
      </div>

      <div style="grid-column: span 2;">
        <label>Reason</label>
        <input type="text" id="appointmentReason" required />
      </div>

      <div class="form-actions">
        <button type="submit" class="primary-btn">Book</button>
        <button type="button" class="secondary-btn" id="btnCancelForm">Cancel</button>
      </div>

    </form>

  </div>
</div>

<!-- JS -->
<script type="module" src="../js/my-appointments.js"></script>
<script src="../js/layout.js"></script>

</body>
</html>
