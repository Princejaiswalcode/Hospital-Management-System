  <!-- MAIN -->

  <main class="main">

```
<!-- HEADER -->
<header class="header">
  <div>
    <h1>Welcome, <span id="userName">—</span></h1>
    <p id="userRole">— Dashboard</p>
  </div>

  <div class="user">
    <span id="headerUserName">—</span>
    <div class="avatar" id="userAvatar">?</div>
  </div>
</header>

<!-- PAGE TITLE -->
<div class="page-title">
  <h2>Appointment Management</h2>
  <button class="primary-btn" id="btnShowForm">+ New Appointment</button>
</div>

<!-- ✅ MODAL OVERLAY (NEW) -->
<div id="appointmentModal" class="modal hidden">

  <!-- BACKDROP -->
  <div class="modal-backdrop" id="modalBackdrop"></div>

  <!-- MODAL CONTENT -->
  <div class="modal-content">

    <h3>Schedule New Appointment</h3>

    <form id="appointmentForm" class="form-grid">

      <div>
        <label>Patient</label>
        <select id="patientSelect" required>
          <option value="">Select Patient</option>
        </select>
      </div>

      <div>
        <label>Doctor</label>
        <select id="doctorSelect" required>
          <option value="">Select Doctor</option>
        </select>
      </div>

      <div>
        <label>Date</label>
        <input type="date" id="appointmentDate" required />
      </div>

      <div>
        <label>Time</label>
        <select id="appointmentTime" required>
          <option value="">Select Time</option>
        </select>
      </div>

      <div style="grid-column: span 2;">
        <label>Reason</label>
        <input type="text" id="appointmentReason" placeholder="Eg: Consultation, Fever" required />
      </div>

      <div style="grid-column: span 2;">
        <label>Notes (optional)</label>
        <input type="text" id="appointmentNotes" placeholder="Additional notes (optional)" />
      </div>

      <div class="form-actions">
        <button type="submit" class="primary-btn">Create Appointment</button>
        <button type="button" class="secondary-btn" id="btnCancelForm">Cancel</button>
      </div>

    </form>

  </div>
</div>

<!-- APPOINTMENTS TABLE -->
<div class="card">
  <table class="table">
    <thead>
      <tr>
        <th>PATIENT ID</th>
        <th>PATIENT</th>
        <th>DOCTOR</th>
        <th>DATE</th>
        <th>TIME</th>
        <th>REASON</th>
        <th>STATUS</th>
      </tr>
    </thead>
    <tbody id="appointmentsTable">
      <!-- Injected by JS -->
    </tbody>
  </table>
</div>
```
